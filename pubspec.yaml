name: generate_crossword
description: "Generador de crucigramas en Flutter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  built_collection: any
  built_value: any
  characters: any
  flutter_riverpod: any
  intl: any
  material_ui: any
  riverpod: any
  riverpod_annotation: any
  two_dimensional_scrollables: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  build_runner: any
  built_value_generator: any
  riverpod_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/words.txt